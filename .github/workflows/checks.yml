name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -e '.[dev]' -r requirements-docs.txt
      - run: ruff check unorl scripts tests
      - run: ruff format --check unorl scripts tests
      - run: pytest tests/test_repository.py
      - run: python scripts/research/build.py
      - run: npm ci
      - run: npm run docs:build
      - run: python scripts/research/check_site.py
